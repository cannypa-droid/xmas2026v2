<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>2026 聖誕節抽籤</title>
<style>
:root{--red:#b3262d;--red2:#8e1c22;--green:#1f5d3a;--gold:#d9a93b;--brown:#4a2c17;--ink:#2b2320;--paper:#fffaf0;--line:#eadfc8;--bg1:#0f2a4a;--bg2:#1d4a73}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",-apple-system,"Segoe UI",sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--bg1),var(--bg2) 60%,#2b5f8a);min-height:100vh;min-height:100dvh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.snow i{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 14px 48px}
h1{color:#fff;font-size:22px;text-align:center;margin:8px 0 2px;letter-spacing:1px}
.sub{color:#cfe3f5;text-align:center;font-size:14px;margin:0 0 14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.panel h2{margin:0 0 10px;font-size:17px;color:var(--red2)}
label{display:block;font-weight:600;margin:8px 0 4px;font-size:14px}
input[type=text],textarea{width:100%;padding:12px;border:1.5px solid #d8cba9;border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
button{font:inherit;font-size:16px;font-weight:700;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;background:var(--red);color:#fff;touch-action:manipulation}
button:active{transform:scale(.98)}
button.secondary{background:#fff;color:var(--red2);border:1.5px solid var(--red)}
button.small{font-size:13px;padding:7px 11px;border-radius:9px}
button.green{background:var(--green)}
button:disabled{background:#c9c2b3;color:#7d766a;cursor:not-allowed;border-color:#c9c2b3}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.full{width:100%}
.hint{font-size:13px;color:#7a6c58;margin:6px 0}
.ok{background:#e8f5ec;border:1px solid #9fd2ae;color:#17552f;padding:12px;border-radius:12px;font-weight:600}
.warn{background:#fff3df;border:1px solid #f0cb8d;color:#7a4b00;padding:12px;border-radius:12px}
.err{background:#fde9e9;border:1px solid #f0a8a8;color:#8a1717;padding:12px;border-radius:12px;margin:10px 0}
.bar{height:22px;border-radius:12px;background:#eadfc8;overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:linear-gradient(90deg,var(--green),#3f9a63);transition:width .5s;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;min-width:0}
.stat{display:flex;gap:8px;margin:8px 0}
.stat>div{flex:1;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.stat b{display:block;font-size:22px;color:var(--red2)}
.stat span{font-size:12px;color:#7a6c58}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{padding:5px 10px;border-radius:999px;font-size:14px;background:#e8f5ec;border:1px solid #9fd2ae;color:#17552f}
.chip.no{background:#fff3df;border-color:#f0cb8d;color:#7a4b00}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--gold);color:#3b2a00;font-weight:700;vertical-align:middle}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.plist li .nm{flex:1;min-width:90px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:#e0a23b;display:inline-block;margin-right:4px}
.dot.on{background:#2f9a5b}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--red2);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.modal .box{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow:auto;text-align:center}
.modal .box h3{margin:0 0 8px;color:var(--red2)}
.modal .row{justify-content:center;margin-top:14px}
.modal img.qr{width:240px;height:240px;image-rendering:pixelated;border:6px solid #fff;outline:1px solid var(--line)}
.linkbox{word-break:break-all;font-size:12px;background:#f6f0e0;padding:8px;border-radius:8px;text-align:left;margin-top:8px;user-select:all}
/* ---- 禮物盒動畫 ---- */
.stage{display:flex;flex-direction:column;align-items:center;padding:10px 0}
.gift{position:relative;width:170px;height:170px;margin:30px 0 20px}
.gift .boxb{position:absolute;bottom:0;left:10px;right:10px;height:110px;background:var(--red);border-radius:6px 6px 10px 10px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.gift .boxb:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;background:var(--gold)}
.gift .lid{position:absolute;left:0;right:0;bottom:100px;height:38px;background:var(--red2);border-radius:8px;transform-origin:left bottom;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.gift .lid:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;background:var(--gold)}
.gift .bow{position:absolute;left:50%;bottom:136px;width:60px;height:34px;margin-left:-30px}
.gift .bow:before,.gift .bow:after{content:"";position:absolute;top:0;width:28px;height:30px;border:7px solid var(--gold);border-radius:50% 50% 50% 0}
.gift .bow:before{left:0;transform:rotate(-20deg)}
.gift .bow:after{right:0;transform:scaleX(-1) rotate(-20deg)}
.gift .glow{position:absolute;left:50%;bottom:90px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff6c4;opacity:0;box-shadow:0 0 40px 30px #ffe58a}
.gift.opening{animation:shake .6s ease-in-out 2}
.gift.opening .lid{animation:lid 2s ease-in forwards}
.gift.opening .bow{animation:bowfly 2s ease-in forwards}
.gift.opening .glow{animation:glow 2s ease-out forwards}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}80%{transform:rotate(-4deg)}}
@keyframes lid{0%,60%{transform:translateY(0) rotate(0)}100%{transform:translateY(-90px) rotate(-35deg);opacity:0}}
@keyframes bowfly{0%,60%{transform:translateY(0);opacity:1}100%{transform:translateY(-120px);opacity:0}}
@keyframes glow{0%,55%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(3)}}
.bigbtn{font-size:20px;padding:16px 40px;border-radius:999px;box-shadow:0 6px 0 var(--red2)}
.cap{color:#fff;text-align:center;font-size:15px;margin:6px 0}
/* ---- 聖誕卡片(文字區位置以圖片比例定位) ---- */
.cardwrap{display:flex;flex-direction:column;align-items:center;animation:pop .7s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.card{position:relative;width:min(92vw,430px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card img{display:block;width:100%;height:auto}
.slipbox{position:absolute;left:var(--bx,27%);width:var(--bw,46%);top:var(--by,38%);height:var(--bh,31%);display:flex;align-items:center;justify-content:center;text-align:center}
.sliptext{color:#4a2c17;font-weight:700;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-height:100%;width:100%}
.footer{color:#9fbad4;font-size:12px;text-align:center;margin-top:20px}
.hidden{display:none!important}

body.magic{background:radial-gradient(ellipse at 50% 0%,#33265f 0%,#171235 55%,#0b0920 100%)}
#magicbg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#magicbg i{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe9a8;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.3)}}
.candles{position:relative;height:96px;margin:0 auto -34px;max-width:420px;z-index:2}
.candle{position:absolute;width:16px;border-radius:3px 3px 2px 2px;background:linear-gradient(90deg,#f6ecd0,#e5d3a2);animation:bob 3.2s ease-in-out infinite}
.candle:before{content:"";position:absolute;left:50%;top:-18px;width:10px;height:18px;margin-left:-5px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(#fff6c8 20%,#ffb93b 70%);box-shadow:0 0 18px 8px rgba(255,190,70,.55);animation:fl .35s ease-in-out infinite alternate}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes fl{from{transform:scaleY(.9) rotate(-3deg)}to{transform:scaleY(1.08) rotate(3deg)}}
.scroll{position:relative;z-index:1;margin:26px 8px 10px;padding:34px 20px 26px;border-radius:6px;color:#3b2a14;text-align:center;
  font-family:"Noto Serif TC","Songti TC","STSong","PMingLiU","Source Han Serif TC",serif;
  background:radial-gradient(ellipse at 30% 20%,#fbf0cf 0%,#efdca8 70%,#e1c98a 100%);
  box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 0 40px rgba(150,105,40,.35);border:1px solid #b58b45;animation:pop .8s ease-out}
.scroll:before,.scroll:after{content:"";position:absolute;left:-12px;right:-12px;height:18px;border-radius:10px;background:linear-gradient(#d8b46a,#9c7433);box-shadow:0 3px 6px rgba(0,0,0,.35)}
.scroll:before{top:-10px}.scroll:after{bottom:-10px}
.kicker{font-size:13px;letter-spacing:4px;color:#8a1c24;font-weight:700;margin-bottom:6px}
.deco{font-size:26px;letter-spacing:10px;margin-bottom:8px}
.scroll h2{margin:8px 0 4px;font-size:22px;line-height:1.5;color:#3b2a14;font-weight:900;text-wrap:balance}
.scroll .lead{font-size:19px;line-height:1.7;margin:4px 0 14px;font-weight:700}
.scroll textarea{width:100%;min-height:150px;border:1px dashed #a07a3a;border-radius:6px;padding:8px 10px;color:#3b2a14;font:inherit;font-size:17px;line-height:30px;
  background:repeating-linear-gradient(transparent,transparent 29px,rgba(139,100,40,.45) 30px);background-attachment:local}
.scroll .tiny{font-size:12px;color:#7a5a2a;margin:6px 0 0}
.seal{width:54px;height:54px;border-radius:50%;margin:16px auto 0;background:radial-gradient(circle at 35% 30%,#d9444b,#8a1c24 70%);box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 0 6px rgba(0,0,0,.35);color:#f7d98b;font-size:26px;line-height:54px}
.nextline{color:#fff;font-size:18px;font-weight:700;text-align:center;margin:20px 0 10px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div class="wrap"><div id="app"></div></div>
<script src="config.js"></script>
<script>
(function(){
"use strict";
/* ============ 工具 ============ */
var CFG = window.XMAS_CONFIG || {};
var app = document.getElementById("app");
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var ERR = {
  E_UNAUTHORIZED:"連結無效或已失效,請向主辦人重新索取專屬連結。",
  E_LOCKED:"填寫階段已結束,內容已鎖定,無法再修改。",
  E_INCOMPLETE:"尚有參加者未完成填寫,無法開始抽籤。",
  E_TOO_FEW:"參加人數至少需要 2 人。",
  E_TOO_MANY:"參加人數上限為 100 人。",
  E_DUP_NAME:"名單中有重複的姓名,請加上區別(例如:小明A、小明B)。",
  E_BAD_NAME:"名稱格式不正確(活動名稱 1~60 字、姓名 1~30 字)。",
  E_BAD_SLIP:"籤的內容需為 1~80 個字。",
  E_BAD_NOTE:"真心話內容需為 1~300 個字。",
  E_ALREADY_STARTED:"抽籤已經啟動過了。",
  E_NOT_OPEN:"尚未開放,或你還沒完成抽籤(要先抽完籤才能送出)。",
  E_SERVER:"伺服器暫時忙碌(可能同時送出的人較多),請等幾秒後再按一次送出。",
  E_NOFN:"後端程式還是舊版,缺少這個功能。請把最新的 Code.gs 貼到 Apps Script,並到「部署 → 管理部署作業 → ✏️ → 版本:新版本 → 部署」重新部署。",
  E_VERIFY_FAILED:"分配驗證失敗,系統已自動還原,尚未開放抽籤。請再按一次重試。",
  E_DERANGE_FAILED:"分配失敗,系統已自動還原,尚未開放抽籤。請再按一次重試。"
};
var RETRY={submit_slip:1,submit_note:1,reveal:1,participant_state:1,host_state:1};
function rpc(fn,args){
  var n=0;
  function go(){
    return rpc1(fn,args).catch(function(e){
      if(RETRY[fn]&&(e.code==="E_SERVER"||e.code==="E_NET")&&n<3){n++;return new Promise(function(r){setTimeout(r,1200*n)}).then(go)}
      throw e;
    });
  }
  return go();
}
function rpc1(fn,args){
  var url=CFG.APPS_SCRIPT_URL;
  if(!url||url.indexOf("你的")>=0){return Promise.reject({code:"E_CONFIG",message:"尚未設定 config.js(Apps Script 網頁應用程式網址)。"})}
  return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args||{}}),redirect:"follow"})
  .then(function(r){
    return r.text().then(function(t){
      var j=null;try{j=JSON.parse(t)}catch(e){}
      if(!j){throw {code:"E_NET",message:"伺服器回應異常,請確認 Apps Script 已部署為「任何人」可存取,且網址正確。"}}
      if(j.error==="E_NOFN"){
        var dep=(url.match(/\/s\/([^\/]+)\//)||[])[1]||"";
        return fetch(url,{redirect:"follow"}).then(function(g){return g.text()}).catch(function(){return ""}).then(function(gt){
          var v="";try{v=JSON.parse(gt).data}catch(e){}
          var vm=(v.match(/版本:([^(。]+)/)||[])[1];
          throw {code:"E_NOFN",message:ERR.E_NOFN+" 【診斷】網站目前連到的部署 ID 結尾:…"+dep.slice(-8)+";該部署回報的後端版本:"+(vm||"無版本資訊(很舊的版本)")+";需要的版本:2026-10-14-note-v2。"};
        });
      }
      if(j.error){throw {code:j.error,message:ERR[j.error]||("系統錯誤:"+j.error)}}
      return j.data;
    });
  },function(){throw {code:"E_NET",message:"網路連線失敗,請檢查網路後再試。"}});
}
function toast(msg){var d=document.createElement("div");d.textContent=msg;d.style.cssText="position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;z-index:99;font-size:14px;max-width:90vw";document.body.appendChild(d);setTimeout(function(){d.remove()},2000)}
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(t).then(function(){toast("已複製")},fb)}
  fb();
  function fb(){var ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;top:0;opacity:0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");toast("已複製")}catch(e){toast("請長按文字手動複製")}ta.remove()}
}
function modal(html){
  var m=document.createElement("div");m.className="modal";m.innerHTML='<div class="box">'+html+'</div>';document.body.appendChild(m);
  return m;
}
function confirmBox(title,msg,okText){
  return new Promise(function(res){
    var m=modal('<h3>'+esc(title)+'</h3><div style="text-align:left;font-size:15px;line-height:1.6">'+msg+'</div><div class="row"><button class="secondary" data-k="no">取消</button><button data-k="yes">'+esc(okText||"確定")+'</button></div>');
    m.addEventListener("click",function(e){var k=e.target.getAttribute&&e.target.getAttribute("data-k");if(k){m.remove();res(k==="yes")}});
  });
}
(function snow(){var s=$("#snow"),h="";for(var i=0;i<26;i++){var sz=3+Math.random()*5;h+='<i style="left:'+(Math.random()*100)+'%;width:'+sz+'px;height:'+sz+'px;animation-duration:'+(7+Math.random()*10)+'s;animation-delay:-'+(Math.random()*12)+'s"></i>'}s.innerHTML=h})();

/* ============ 路由 ============ */
var qs=new URLSearchParams(location.search);
var EID=qs.get("e"), PTOKEN=qs.get("t");
var hashH=(location.hash.match(/[#&]h=([0-9a-f]+)/)||[])[1];
var HTOKEN=null;
if(EID){
  if(hashH){try{localStorage.setItem("xmas_host_"+EID,hashH)}catch(e){}HTOKEN=hashH}
  else{try{HTOKEN=localStorage.getItem("xmas_host_"+EID)}catch(e){}}
}
var pollTimer=null;
function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
function startPoll(fn,ms){stopPoll();pollTimer=setInterval(function(){if(!document.hidden)fn()},ms)}
function baseUrl(){return location.origin+location.pathname}
function participantLink(tok){return baseUrl()+"?e="+EID+"&t="+tok}
function hostLink(){return baseUrl()+"?e="+EID+"#h="+HTOKEN}

if(PTOKEN&&EID){participantView()}
else if(EID&&HTOKEN){hostView()}
else{landing()}

/* ============ 首頁:建立活動 ============ */
function landing(){
  stopPoll();
  var last=null;try{var k=Object.keys(localStorage).filter(function(x){return x.indexOf("xmas_host_")===0});if(k.length)last=k[k.length-1].replace("xmas_host_","")}catch(e){}
  app.innerHTML='<h1>🎄 2026 聖誕節抽籤</h1><p class="sub">建立活動 · 每人填一張籤 · 全員完成後才開抽</p>'+
  (last?'<div class="panel"><h2>繼續管理上次的活動</h2><button class="full green" id="goLast">回到主辦人後台</button></div>':'')+
  '<div class="panel"><h2>建立新活動(主辦人)</h2>'+
  '<label for="evname">活動名稱</label><input type="text" id="evname" value="2026 聖誕節交換禮物抽籤" maxlength="60">'+
  '<label for="names">參加者名單(一行一位,至少 2 人,姓名不可重複)</label>'+
  '<textarea id="names" placeholder="小明&#10;小華&#10;小美"></textarea>'+
  '<div class="hint">建立後會產生每位參加者的「個人專屬連結」。主辦人若也要參加,請把自己列入名單。</div>'+
  '<div id="cerr"></div><button class="full" id="create">建立活動</button></div>'+
  '<div class="footer">資料儲存於 Google 試算表 · 連結請勿公開張貼</div>';
  if(last)$("#goLast").onclick=function(){location.href="?e="+last};
  $("#create").onclick=function(){
    var names=$("#names").value.split(/\r?\n/).map(function(s){return s.trim()}).filter(Boolean);
    var btn=this;btn.disabled=true;$("#cerr").innerHTML="";
    rpc("create_event",{p_name:$("#evname").value,p_names:names}).then(function(r){
      try{localStorage.setItem("xmas_host_"+r.event_id,r.host_token)}catch(e){}
      location.href="?e="+r.event_id+"#h="+r.host_token;
    }).catch(function(e){btn.disabled=false;$("#cerr").innerHTML='<div class="err">'+esc(e.message)+'</div>'});
  };
}

/* ============ 主辦人後台 ============ */
var hs=null, hshowAll=false, hshowNotes=false, hstarting=false, hstartErr="";
function hostView(){
  stopPoll();
  app.innerHTML='<h1>🎅 主辦人後台</h1><p class="sub" id="hsub">載入中…</p><div id="hbody"></div>';
  loadHost(true);
  startPoll(function(){loadHost(false)},8000);
}
function loadHost(first){
  rpc("host_state",{p_event:EID,p_host:HTOKEN}).then(function(s){
    var sig=JSON.stringify(s);
    if(!first&&hs&&hs._sig===sig)return;
    s._sig=sig;hs=s;renderHost();
  }).catch(function(e){
    if(first||e.code==="E_UNAUTHORIZED"){stopPoll();app.innerHTML='<h1>🎅 主辦人後台</h1><div class="panel"><div class="err">'+esc(e.message)+'</div><button class="full" id="home">回首頁</button></div>';$("#home").onclick=function(){try{localStorage.removeItem("xmas_host_"+EID)}catch(x){}location.href=location.pathname}}
  });
}
function renderHost(){
  var ev=hs.event, ps=hs.participants, n=ps.length;
  var focusId=document.activeElement&&document.activeElement.id, focusVal=document.activeElement&&document.activeElement.value;

var qrLoading=null;
function loadQR(){
  if(window.qrcode)return Promise.resolve(true);
  if(qrLoading)return qrLoading;
  qrLoading=new Promise(function(res){var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";s.onload=function(){res(!!window.qrcode)};s.onerror=function(){res(false)};document.head.appendChild(s)});
  return qrLoading;
}
function showQR(name,url){
  var m=modal('<h3>'+esc(name)+' 的專屬 QR Code</h3><div id="qrarea" class="hint">產生中…</div><div class="linkbox">'+esc(url)+'</div><div class="row"><button class="secondary small" data-k="copy">複製連結</button><button class="small" data-k="close">關閉</button></div>');
  m.addEventListener("click",function(e){var k=e.target.getAttribute&&e.target.getAttribute("data-k");if(k==="close"||e.target===m)m.remove();if(k==="copy")copyText(url)});
  loadQR().then(function(ok){var el=m.querySelector("#qrarea");if(!el)return;
    if(!ok){el.textContent="QR 產生工具載入失敗,請改用複製連結。";return}
    var q=window.qrcode(0,"M");q.addData(url);q.make();el.className="";el.innerHTML='<img class="qr" alt="QR Code" src="'+q.createDataURL(6,2)+'">';
  });
}

function loadP(first){

    var changed=!ps_||ps_.phase!==s.phase||ps_.revealed!==s.revealed;
    var prev=ps_;ps_=s;
    if(first||changed)renderP();
    else if(s.phase===1&&prev){/* 第一階段不重繪,避免打斷輸入 */}
  }).catch(function(e){
    if(first||e.code==="E_UNAUTHORIZED"){stopPoll();app.innerHTML='<h1>🎄 聖誕節抽籤</h1><div class="panel"><div class="err">'+esc(e.message)+'</div></div>'}
  });

function fitText(el,box){
  if(!el||!box)return;var w=$("#card").clientWidth,max=w*0.095,min=w*0.03,fs=max;
  el.style.fontSize=fs+"px";
  while(fs>min&&(el.scrollHeight>box.clientHeight+1||el.scrollWidth>box.clientWidth+1)){fs-=1;el.style.fontSize=fs+"px"}
}

/* ============ 下載 PNG(背景 + 文字,Canvas 繪製) ============ */
var BOX={x:0.27,w:0.46,y:0.38,h:0.31};   // 與 CSS 變數一致(相對於圖片寬/高)
var FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif';
function tokens(line){return line.match(/[\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef\u3000-\u303f]|[^\s\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef\u3000-\u303f]+|\s+/g)||[]}
function wrap(ctx,text,maxW){
  var lines=[];text.split(/\r?\n/).forEach(function(par){
    var cur="";tokens(par).forEach(function(tk){
      var t=cur+tk;
      if(ctx.measureText(t).width<=maxW||!cur.trim()){
        if(ctx.measureText(tk).width>maxW){ // 超長英數字串逐字拆
          tk.split("").forEach(function(ch){if(ctx.measureText(cur+ch).width>maxW&&cur){lines.push(cur);cur=ch}else cur+=ch});
        }else cur=t;
      }else{lines.push(cur.replace(/\s+$/,""));cur=tk.replace(/^\s+/,"")}
    });lines.push(cur);
  });return lines;
}
function renderPng(text){
  return new Promise(function(res,rej){
    var img=new Image();img.onload=function(){
      var W=img.naturalWidth,H=img.naturalHeight,c=document.createElement("canvas");c.width=W;c.height=H;
      var ctx=c.getContext("2d");ctx.drawImage(img,0,0,W,H);
      var bx=BOX.x*W,bw=BOX.w*W,by=BOX.y*H,bh=BOX.h*H,fs=W*0.095,lines;
      for(;fs>=W*0.03;fs-=1){ctx.font="700 "+fs+"px "+FONT;lines=wrap(ctx,text,bw);if(lines.length*fs*1.4<=bh)break}
      ctx.fillStyle="#4a2c17";ctx.textAlign="center";ctx.textBaseline="middle";
      var lh=fs*1.4,top=by+bh/2-lines.length*lh/2;
      lines.forEach(function(l,i){ctx.fillText(l,bx+bw/2,top+lh*i+lh/2)});
      c.toBlob(function(b){b?res(b):rej(new Error("toBlob"))},"image/png");
    };img.onerror=function(){rej(new Error("img"))};img.src="card.jpg?v=1";
  });
}
function saveCard(text){
  var go=function(){return renderPng(text)};
  (document.fonts&&document.fonts.load?document.fonts.load("700 40px "+FONT,text).catch(function(){}):Promise.resolve()).then(go).then(function(blob){
    var file;try{file=new File([blob],"christmas-slip.png",{type:"image/png"})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file]}).catch(function(e){if(e&&e.name==="AbortError")return;throw e});
    }
    throw new Error("fallback");
  }).catch(function(){
    renderPng(text).then(function(blob){
      var url=URL.createObjectURL(blob);
      var m=modal('<h3>長按圖片即可儲存</h3><img src="'+url+'" style="width:100%;border-radius:8px" alt="聖誕卡片"><div class="hint">iPhone / Android:長按圖片 →「加入照片」或「下載圖片」。<br>LINE 內建瀏覽器若無法儲存,請點右下角「⋯」→「以預設瀏覽器開啟」。</div><div class="row"><a href="'+url+'" download="christmas-slip.png"><button class="small">下載 PNG</button></a><button class="secondary small" data-k="close">關閉</button></div>');
      m.addEventListener("click",function(e){if(e.target===m||(e.target.getAttribute&&e.target.getAttribute("data-k")==="close"))m.remove()});
    }).catch(function(){toast("產生圖片失敗,請截圖儲存")});
  });
}
})();
</script>
<button id="musicbtn" aria-label="背景音樂開關" title="背景音樂">🔔</button>
<style>
#musicbtn{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:40;width:44px;height:44px;padding:0;border-radius:50%;font-size:22px;line-height:44px;background:rgba(255,255,255,.92);color:#b3262d;border:2px solid #d9a93b;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#musicbtn.off{opacity:.7;filter:grayscale(1)}
#musicbtn.hint{animation:mpulse 1.6s ease-in-out infinite}
@keyframes mpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
</style>
<script>
/* 聖誕背景音樂:預設用 Web Audio 即時合成「音樂盒」音色演奏傳統聖誕歌曲(公有領域旋律,無版權問題)。
   若在網站資料夾放入 music.mp3,會改播該檔案。手機必須點一下畫面才能發聲(瀏覽器規定)。 */
(function(){
  var KEY="xmas_music", btn=document.getElementById("musicbtn");
  var wantOn=true; try{ if(localStorage.getItem(KEY)==="off") wantOn=false; }catch(e){}
  var ctx=null, master=null, bus=null, started=false, nextEnd=0, poller=null, fileEl=null, flyEl=null, hasFile=false, hasFly=true, flyTry=0, songIdx=0, mode="xmas";
  var F={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,C6:1046.5};
  var WISH=[["G4",1],["C5",1],["C5",.5],["D5",.5],["C5",.5],["B4",.5],["A4",1],["A4",1],["A4",1],["D5",1],["D5",.5],["E5",.5],["D5",.5],["C5",.5],["B4",1],["G4",1],["G4",1],["E5",1],["E5",.5],["F5",.5],["E5",.5],["D5",.5],["C5",1],["A4",1],["G4",.5],["G4",.5],["A4",1],["D5",1],["B4",1],["C5",3],["R",2]];
  var JINGLE=[["E5",1],["E5",1],["E5",2],["E5",1],["E5",1],["E5",2],["E5",1],["G5",1],["C5",1.5],["D5",.5],["E5",4],["F5",1],["F5",1],["F5",1.5],["F5",.5],["F5",1],["E5",1],["E5",1],["E5",.5],["E5",.5],["E5",1],["D5",1],["D5",1],["E5",1],["D5",2],["G5",2],["R",2]];
  var JOY=[["C5",1],["B4",1.5],["A4",.5],["G4",1.5],["F4",.5],["E4",1],["D4",1],["C4",2],["R",1],["G4",1],["A4",1.5],["A4",.5],["B4",1.5],["B4",.5],["C5",3],["R",3]];
  var SONGS=[[WISH,.55],[JINGLE,.5],[JOY,.6]];   // [旋律, 每拍秒數]
  function tone(f,t,d,vol){
    var o1=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();
    o1.type="sine";o2.type="triangle";o1.frequency.value=f;o2.frequency.value=f*2;
    var end=t+Math.max(d,.35)+1.1;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,end);
    var g2=ctx.createGain();g2.gain.value=.35;o2.connect(g2);g2.connect(g);o1.connect(g);g.connect(bus||master);
    o1.start(t);o2.start(t);o1.stop(end+.05);o2.stop(end+.05);
  }

  F.B3=246.94;F.A3=220;F.G3=196;
  var CH={C:["C4","E4","G4"],G:["B3","D4","G4"],Am:["A3","C4","E4"],F:["A3","C4","F4"]};
  var FLYBARS=[["C",[["E5",2],["G5",1],["E5",1]]],["G",[["D5",2],["B4",1],["D5",1]]],["Am",[["C5",2],["E5",1],["A4",1]]],["F",[["A4",2],["C5",2]]],
               ["C",[["G5",2],["E5",1],["C5",1]]],["G",[["D5",3],["B4",1]]],["Am",[["A4",1],["C5",1],["E5",2]]],["F",[["A4",2],["G4",2]]]];
  function scheduleFly(){
    var beat=.72, t=Math.max(ctx.currentTime,nextEnd)+.15;
    FLYBARS.forEach(function(b){
      var ch=CH[b[0]], pat=[0,1,2,1,0,1,2,1];
      pat.forEach(function(ix,i){ tone(F[ch[ix]],t+i*beat/2,beat/2,.07); });
      var mt=t; b[1].forEach(function(n){ tone(F[n[0]],mt,n[1]*beat,.17); mt+=n[1]*beat; });
      t+=4*beat;
    });
    nextEnd=t+beat;
  }
  function scheduleSong(){
    if(mode==="fly"){scheduleFly();return;}
    var s=SONGS[songIdx%SONGS.length];songIdx++;
    var t=Math.max(ctx.currentTime,nextEnd)+.15;
    s[0].forEach(function(n){ if(n[0]!=="R") tone(F[n[0]],t,n[1]*s[1],.2); t+=n[1]*s[1]; });
    nextEnd=t;
  }
  function usingFile(){ return mode==="fly"?hasFly:hasFile; }
  function newBus(){ if(!ctx)return; try{ if(bus)bus.disconnect(); }catch(e){} bus=ctx.createGain(); bus.connect(master); }
  function tick(){ if(usingFile())return; if(ctx&&ctx.state==="running"&&ctx.currentTime>nextEnd-1.5) scheduleSong(); }
  function setUI(on){ if(!btn)return; btn.textContent=on?"🔔":"🔕"; btn.className=on?"":"off"; btn.title=on?"關閉背景音樂":"開啟背景音樂"; }
  function fileFor(){ if(mode==="fly"){ if(!flyEl){flyEl=new Audio();flyEl.src=["fly.m4a","fly.mp3"][flyTry];flyEl.loop=true;flyEl.volume=.7;
      flyEl.addEventListener("error",function(){ if(flyTry<1){flyTry++;flyEl.src="fly.mp3";flyEl.play().catch(function(){});} else { hasFly=false; flyEl=null; if(mode==="fly"&&started&&wantOn)start(); } }); }
    return flyEl; }
    if(!fileEl){fileEl=new Audio("music.mp3");fileEl.loop=true;fileEl.volume=.5;} return fileEl; }
  function start(){
    started=true; btn.classList.remove("hint");
    if(usingFile()){ if(ctx&&ctx.state==="running")ctx.suspend(); fileFor().play().catch(function(){}); return; }
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    if(!ctx){ ctx=new AC(); master=ctx.createGain(); master.gain.value=.5; master.connect(ctx.destination); nextEnd=0; newBus(); }
    var go=function(){ if(!poller){ scheduleSong(); poller=setInterval(tick,400); } };
    if(ctx.state==="suspended") ctx.resume().then(go,go); else go();
  }
  function stop(){ if(fileEl)fileEl.pause(); if(flyEl)flyEl.pause(); if(ctx&&ctx.state==="running")ctx.suspend(); }
  function toggle(e){
    if(e){e.stopPropagation();}
    wantOn=!wantOn; try{localStorage.setItem(KEY,wantOn?"on":"off")}catch(x){}
    setUI(wantOn); if(wantOn)start(); else stop();
  }
  btn.addEventListener("click",toggle);
  function firstGesture(){
    if(started)return;
    if(wantOn) start();
    if(started){document.removeEventListener("click",firstGesture,true);document.removeEventListener("touchend",firstGesture,true);}
  }
  document.addEventListener("click",firstGesture,true);
  document.addEventListener("touchend",firstGesture,true);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden)stop(); else if(wantOn&&started){ if(usingFile())fileFor().play().catch(function(){}); else if(ctx)ctx.resume(); }
  });
  setUI(wantOn); if(wantOn) btn.classList.add("hint");
  try{ fetch("music.mp3",{method:"HEAD"}).then(function(r){ if(r.ok){hasFile=true;} }).catch(function(){}); }catch(e){}
  function setMode(m){
    if(m===mode)return; mode=m; nextEnd=0;
    if(fileEl)fileEl.pause(); if(flyEl)flyEl.pause();
    newBus();                                   // 切斷舊模式已排程的音符
    if(started&&wantOn){ if(ctx&&ctx.state==="suspended"&&!usingFile())ctx.resume(); if(!usingFile()){ if(ctx)scheduleSong(); else start(); } else start(); }
  }
  window.XMASAUDIO={ setMode:setMode, chime:function(){
    try{ if(!ctx||ctx.state!=="running"||!wantOn)return; var t=ctx.currentTime+.05;
      ["C5","E5","G5","C6"].forEach(function(n,i){tone(F[n],t+i*.11,.3,.28)}); }catch(e){} } };
})();
</script>
</body>
